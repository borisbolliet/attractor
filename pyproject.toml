[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attractor"
version = "1.2.0"
description = "Predator-prey models, fixed-step integrators, cycle periods and reaction-diffusion patterns"
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
fit = ["scipy>=1.11"]
plot = ["matplotlib>=3.8"]
test = ["pytest>=8", "pytest-cov>=6"]
docs = ["zensical>=0.1", "mkdocstrings-python>=2"]

[project.scripts]
attractor-simulate = "attractor.cli:simulate"
attractor-periods = "attractor.cli:periods"
attractor-fit = "attractor.cli:fit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attractor = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "--doctest-modules"

[tool.mutmut]
source_paths = ["src/"]
do_not_mutate = ["*/cli.py", "*/cycles.py", "*/datasets.py", "*/models.py", "*/tools.py", "*/trajectory.py", "*/__init__.py"]
pytest_add_cli_args_test_selection = ["tests/test_integrators.py"]
