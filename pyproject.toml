[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "attractor"
version = "1.0.1"
description = "Predator-prey models, fixed-step integrators and cycle periods"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
fit = ["scipy>=1.11"]
plot = ["matplotlib>=3.8"]

[project.scripts]
attractor-simulate = "attractor.cli:simulate"
attractor-periods = "attractor.cli:periods"
attractor-fit = "attractor.cli:fit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
attractor = ["data/*.csv"]
